{% extends 'base.html' %}{% block title %}{{ '编辑活动' if is_edit else '创建活动' }} · CouponFlow{% endblock %}{% block content %}<div class="narrow-page"><a class="back-link" href="{{ url_for('operator.dashboard') }}">← 返回活动总览</a><div class="page-heading"><p class="kicker">CAMPAIGN BUILDER</p><h1>{{ '编辑优惠券活动' if is_edit else '创建优惠券活动' }}</h1><p>设置库存和有效期，系统会自动追踪领取、核销和转化。</p></div><form method="post" class="form-card"><div class="form-grid"><label class="span-2">活动名称 *<input name="name" required value="{{ campaign.name if campaign else '' }}" placeholder="例如：周末咖啡唤醒计划"></label><label>优惠面额（元） *<input name="amount" type="number" step="0.01" min="1" required value="{{ campaign.amount if campaign else '' }}" placeholder="50"></label><label>总库存 *<input name="stock" type="number" min="1" required value="{{ campaign.stock if campaign else '1' }}" placeholder="100"></label><label>开始时间 *<input name="start_date" type="datetime-local" required value="{{ campaign.start_date.strftime('%Y-%m-%dT%H:%M') if campaign else '' }}"></label><label>结束时间 *<input name="end_date" type="datetime-local" required value="{{ campaign.end_date.strftime('%Y-%m-%dT%H:%M') if campaign else '' }}"></label><label>每人限领数量<input name="per_user_limit" type="number" min="1" value="{{ campaign.per_user_limit if campaign else 1 }}"></label><label>券有效期（天）<input name="coupon_validity_days" type="number" min="1" value="{{ campaign.coupon_validity_days if campaign else '' }}" placeholder="留空=活动截止日到期"><small style="color:#889994">每张券领取后独立计时，留空则统一在活动结束时过期</small></label><label>活动状态{% if is_edit %}<select name="status"><option value="active" {% if campaign.status == 'active' %}selected{% endif %}>进行中</option><option value="draft" {% if campaign.status == 'draft' %}selected{% endif %}>草稿</option><option value="cancelled" {% if campaign.status == 'cancelled' %}selected{% endif %}>已取消</option></select>{% else %}<select name="is_scheduled"><option value="">立即发布</option><option value="on">预约发布（填写后端时间）</option></select>{% endif %}</label><label class="span-2">优惠券用途描述<textarea name="description" rows="4" placeholder="帮助 AI 理解这张券适合谁，例如：适合喜欢咖啡和轻食的用户">{{ campaign.description if campaign else '' }}</textarea></label><label class="span-2">预约发布时间（可选）<input name="scheduled_time" type="datetime-local" value="{{ campaign.scheduled_time.strftime('%Y-%m-%dT%H:%M') if campaign and campaign.scheduled_time else '' }}"></label></div><div class="form-actions"><a class="button" href="{{ url_for('operator.dashboard') }}">取消</a><button class="button button-primary" type="submit">{{ '保存修改' if is_edit else '发布活动' }} →</button></div></form></div>{% endblock %}
