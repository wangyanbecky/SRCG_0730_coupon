{% extends 'base.html' %}{% block title %}注册 · CouponFlow{% endblock %}{% block content %}<div class="auth-inner"><div class="page-heading"><p class="kicker">NEW MEMBER</p><h1>创建你的优惠账户</h1><p>手机号和个人画像可稍后补充，系统会根据偏好优化推荐。</p></div><form method="post" class="form-card register-form"><div class="form-grid"><label>用户名 *<input name="username" required placeholder="例如：xiaoming"></label><label>密码 *<input name="password" type="password" minlength="3" required placeholder="至少 3 位"></label><label>手机号<input name="phone" placeholder="可选，用于门店核销检索"></label><label>年龄<input name="age" type="number" min="1" max="120" placeholder="可选"></label><label>性别<select name="gender"><option value="">请选择</option><option>女</option><option>男</option><option>其他</option></select></label><label>职业<input name="occupation" placeholder="例如：设计师"></label><label class="span-2">兴趣爱好<input name="hobbies" placeholder="用逗号分隔，例如：美食,旅行,运动"></label></div><div class="form-actions"><a class="button" href="{{ url_for('auth.login') }}">返回登录</a><button class="button button-primary" type="submit">完成注册 →</button></div></form></div>{% endblock %}
