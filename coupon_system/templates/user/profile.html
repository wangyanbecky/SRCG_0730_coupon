{% extends 'base.html' %}{% block title %}个人资料 · CouponFlow{% endblock %}{% block content %}<div class="narrow-page"><div class="page-heading"><p class="kicker">YOUR PROFILE</p><h1>个人资料</h1><p>补充你的偏好，AI 会据此生成更贴合的优惠推荐。</p></div><form method="post" class="form-card"><div class="profile-header"><span class="avatar avatar-user large">{{ current_user.username[:1].upper() }}</span><div><h2>{{ current_user.username }}</h2><p>普通用户 · {{ current_user.points }} 积分</p></div></div><div class="form-grid"><label>手机号<input name="phone" value="{{ current_user.phone }}" placeholder="用于门店核销检索"></label><label>年龄<input name="age" type="number" value="{{ current_user.age or '' }}"></label><label>性别<select name="gender"><option value="">请选择</option><option {% if current_user.gender == '女' %}selected{% endif %}>女</option><option {% if current_user.gender == '男' %}selected{% endif %}>男</option><option {% if current_user.gender == '其他' %}selected{% endif %}>其他</option></select></label><label>职业<input name="occupation" value="{{ current_user.occupation }}" placeholder="例如：设计师"></label><label class="span-2">兴趣爱好<input name="hobbies" value="{{ current_user.hobbies }}" placeholder="例如：美食,旅行,运动"></label></div><div class="form-actions"><a class="button" href="{{ url_for('user_bp.dashboard') }}">取消</a><button class="button button-primary" type="submit">保存资料 →</button></div></form></div>{% endblock %}
